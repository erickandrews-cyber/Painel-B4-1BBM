function uid() { return Math.random().toString(36).slice(2, 10); }
function parseBRDate(s) {
  if (!s) return null;
  const [d, m, y] = s.split("/").map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m - 1, d);
}
function formatCurrency(v) { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function sameDate(a, b) { return a.getDate() === b.getDate() && a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }
function prioridadeSev(p) {
  if (p === "Alta") return SEV.critico;
  if (p === "Média") return SEV.atencao;
  return SEV.ok;
}
function agoraFormatado() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function parseBRDateHora(s) {
  if (!s) return null;
  const [datePart, timePart] = s.split(" ");
  const [d, m, y] = datePart.split("/").map(Number);
  const [h, min] = (timePart || "00:00").split(":").map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m - 1, d, h || 0, min || 0);
}
function militarCodigo(nome) {
  const m = MILITARES.find((x) => x.nome === nome);
  if (m) return m.codigo;
  const palavras = nome.replace(/[ºª.]/g, "").split(" ").filter((w) => w.length > 1);
  const ultima = palavras[palavras.length - 1] || nome;
  return ultima.slice(0, 3).toUpperCase();
}
function initialsOf(nome) {
  const parts = nome.replace(/[ºª.]/g, "").split(" ").filter((w) => w.length > 1 && w[0] === w[0].toUpperCase());
  const picked = parts.slice(-2);
  return (picked.length ? picked : [nome]).map((w) => w[0]).join("").toUpperCase().slice(0, 2);
}

function fileToCompressedDataUrl(file, maxDim = 360, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadShared(key, seed, setValue, setReady) {
  try {
    const res = await window.storage.get(key, true);
    if (res && res.value) setValue(JSON.parse(res.value));
    else await window.storage.set(key, JSON.stringify(seed), true);
  } catch (e) {
    try { await window.storage.set(key, JSON.stringify(seed), true); } catch (e2) {}
  }
  setReady(true);
}

function useShared(key, seed, transform) {
  const [value, setValue] = useState(seed);
  const [ready, setReady] = useState(false);
  useEffect(() => { loadShared(key, seed, (v) => setValue(transform ? transform(v) : v), setReady); }, []);
  const persist = async (next) => {
    setValue(next);
    try { await window.storage.set(key, JSON.stringify(next), true); } catch (e) {}
  };
  return [value, persist, ready];
}

function ChaveModal({ veiculo, onClose, onSave }) {
  const [militar, setMilitar] = useState("");

  const [customName, setCustomName] = useState("");
  const [obs, setObs] = useState("");
  const kmAtualNum = veiculo.km && veiculo.km !== "—" ? String(veiculo.km).replace(/\./g, "") : "";
  const [kmSaida, setKmSaida] = useState(kmAtualNum);
  const handleSelect = (e) => {
    if (e.target.value === "__outro__") { setOutro(true); setMilitar(customName); }
    else { setOutro(false); setMilitar(e.target.value); }
  };
  const handleCustomName = (e) => { setCustomName(e.target.value); setMilitar(e.target.value); };
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>

        <div className="modal-body">
          <label>Militar responsável
            <select value={outro ? "__outro__" : militar} onChange={handleSelect}>

function DevolverChaveModal({ entry, onClose, onSave }) {
  const [kmDevolucao, setKmDevolucao] = useState("");
  const kmNum = Number(kmDevolucao);
  const rodado = kmDevolucao !== "" && !isNaN(kmNum) ? kmNum - entry.kmSaida : null;
  const invalido = kmDevolucao !== "" && rodado !== null && rodado < 0;
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h3>Devolver chave — {entry.veiculoNome}</h3><button className="icon-btn" onClick={onClose}><X size={16} /></button></div>
        <div className="modal-body">

          <label>Km de devolução<input type="number" value={kmDevolucao} onChange={(e) => setKmDevolucao(e.target.value)} placeholder="Ex: 48257" /></label>
          {rodado !== null && (
            <div className={invalido ? "km-rodado km-rodado-erro" : "km-rodado"}>
              {invalido ? "Km de devolução não pode ser menor que o de saída" : `Rodado: ${rodado} km`}

          )}
        </div>
        <div className="modal-foot">
          <button className="btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" disabled={kmDevolucao === "" || invalido} onClick={() => onSave(kmNum)}>Confirmar devolução</button>

  const [chavesVeiculos, saveChavesVeiculos, readyChavesV] = useShared("b4-chaves-veiculos", SEED_CHAVES_VEICULOS);
  const [manutencoes, saveManutencoes, readyManut] = useShared("b4-manutencoes", SEED_MANUTENCOES);
  const [cautelasEquip, saveCautelasEquip, readyCautelasEquip] = useShared("b4-cautelas-equip", SEED_CAUTELAS_EQUIP);
  const [org, saveOrg, readyOrg] = useShared("b4-org", DEFAULT_ORG);

  const VALID_TABS = ["geral", "viaturas", "embarcacoes", "chaves", "manutencao", "cautelas", "escalas", "alertas"];
  const initialTab = (() => {
    const h = (typeof window !== "undefined" ? window.location.hash : "").replace("#", "");
    return VALID_TABS.includes(h) ? h : "geral";
  })();
  const [tab, setTabRaw] = useState(initialTab);
  const setTab = (t) => {
    setTabRaw(t);
    if (typeof window !== "undefined") window.location.hash = t;
  };
  useEffect(() => {
    const onHashChange = () => {
      const h = window.location.hash.replace("#", "");
      if (VALID_TABS.includes(h)) setTabRaw(h);
    };
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);
  const visaoExterna = false;
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [calMonthOffset, setCalMonthOffset] = useState(0);

  const [editing, setEditing] = useState(null);
  const [editingCollection, setEditingCollection] = useState(null);
  const [reporting, setReporting] = useState(null);
  const [viewingProblemsVeiculo, setViewingProblemsVeiculo] = useState(null);
  const [editingEscala, setEditingEscala] = useState(null);
  const [editingEscalaOpen, setEditingEscalaOpen] = useState(false);
  const [escalaDefaultDate, setEscalaDefaultDate] = useState("");
  const [editingOrgOpen, setEditingOrgOpen] = useState(false);
  const [pendingConfirm, setPendingConfirm] = useState(null);
  const askConfirm = (message, onYes) => setPendingConfirm({ message, onYes });
  const [viewingPhoto, setViewingPhoto] = useState(null);
  const [chaveModalVeiculo, setChaveModalVeiculo] = useState(null);
  const [devolvendoChave, setDevolvendoChave] = useState(null);
  const [chavesBusca, setChavesBusca] = useState("");
  const [chavesBuscaData, setChavesBuscaData] = useState("");
  const [chavesVisiveis, setChavesVisiveis] = useState(25);
  const [alertasFiltroVeiculo, setAlertasFiltroVeiculo] = useState("");
  const [alertasFiltroEquip, setAlertasFiltroEquip] = useState("");
  const [chaveVeiculoModalOpen, setChaveVeiculoModalOpen] = useState(false);
  const [editingEquip, setEditingEquip] = useState(null);
  const [equipModalOpen, setEquipModalOpen] = useState(false);
  const [mostrarConcluidos, setMostrarConcluidos] = useState(false);
  const [editingCautelaEquip, setEditingCautelaEquip] = useState(null);
  const [cautelaEquipModalOpen, setCautelaEquipModalOpen] = useState(false);
  const [mostrarDevolvidas, setMostrarDevolvidas] = useState(false);
  const [cautelaBusca, setCautelaBusca] = useState("");

  const ready = readyV && readyE && readyP && readyEsc && readyOrg && readyChaves && readyChavesV && readyManut && readyCautelasEquip;
  if (!ready) return <div className="loading">Carregando dados compartilhados…</div>;

  /* ---- viaturas / embarcações ---- */
  const allVehicles = [...viaturas, ...embarcacoes];
  const problemCountFor = (id) => problemas.filter((p) => p.veiculoId === id && p.status === "aberto").length;
  const problemasAbertos = problemas.filter((p) => p.status === "aberto");
  const openEdit = (collection, v) => { setEditingCollection(collection); setEditing(v); };
  const closeEdit = () => { setEditing(null); setEditingCollection(null); };
  const saveEdit = (form) => {
    const list = editingCollection === "viaturas" ? viaturas : embarcacoes;
    const save = editingCollection === "viaturas" ? saveViaturas : saveEmbarcacoes;
    const exists = list.some((x) => x.id === form.id);
    save(exists ? list.map((x) => (x.id === form.id ? form : x)) : [...list, form]);
    closeEdit();
  };
  const deleteVehicle = (collection, v) => {
    askConfirm(`Excluir ${v.nome}?`, () => {
      if (collection === "viaturas") saveViaturas(viaturas.filter((x) => x.id !== v.id));
      else saveEmbarcacoes(embarcacoes.filter((x) => x.id !== v.id));
    });
  };
  const submitReport = (report) => { saveProblemas([report, ...problemas]); setReporting(null); };
  const resolveProblem = (id) => saveProblemas(problemas.map((p) => (p.id === id ? { ...p, status: "resolvido" } : p)));
  const deleteProblem = (id) => saveProblemas(problemas.filter((p) => p.id !== id));

  const handleVehiclePhoto = async (collection, v, file) => {
    try {
      const dataUrl = await fileToCompressedDataUrl(file, 480, 0.75);
      const list = collection === "viaturas" ? viaturas : embarcacoes;
      const save = collection === "viaturas" ? saveViaturas : saveEmbarcacoes;
      save(list.map((x) => (x.id === v.id ? { ...x, foto: dataUrl, fotoPosX: 50, fotoPosY: 50 } : x)));
    } catch (e) { alert("Não foi possível processar essa imagem."); }
  };
  const handleRemoveVehiclePhoto = (collection, v) => {
    const list = collection === "viaturas" ? viaturas : embarcacoes;
    const save = collection === "viaturas" ? saveViaturas : saveEmbarcacoes;
    save(list.map((x) => (x.id === v.id ? { ...x, foto: null } : x)));
  };
  const handleLogoChange = async (file) => {
    try {
      const dataUrl = await fileToCompressedDataUrl(file, 160, 0.85);
      saveOrg({ ...org, brasao: dataUrl });
    } catch (e) { alert("Não foi possível processar essa imagem."); }
  };

  /* ---- escalas ---- */
  const saveEscala = (form) => {
    const exists = escalas.some((x) => x.id === form.id);
    saveEscalas(exists ? escalas.map((x) => (x.id === form.id ? form : x)) : [...escalas, form]);
    setEditingEscalaOpen(false); setEditingEscala(null);
  };
  const deleteEscala = (e) => { askConfirm(`Remover escala de ${e.data}?`, () => saveEscalas(escalas.filter((x) => x.id !== e.id))); };

  /* ---- chaves ---- */
  const findVeiculoById = (id) => viaturas.find((v) => v.id === id) || embarcacoes.find((v) => v.id === id);
  const veiculoCategoria = (id) => (viaturas.some((v) => v.id === id) ? "viaturas" : "embarcacoes");
  const chaveAbertaFor = (veiculoId) => chavesLog.find((c) => c.veiculoId === veiculoId && !c.devolvidaEm);
  const retirarChave = (veiculo, militar, obs, kmSaida) => {
    const entry = { id: uid(), veiculoId: veiculo.id, veiculoNome: veiculo.nome, militar, obs, kmSaida, kmDevolucao: null, retiradaEm: agoraFormatado(), devolvidaEm: null };
    saveChavesLog([entry, ...chavesLog]);
    setChaveModalVeiculo(null);
  };
  const devolverChave = (entry, kmDevolucao) => {
    saveChavesLog(chavesLog.map((c) => (c.id === entry.id ? { ...c, devolvidaEm: agoraFormatado(), kmDevolucao } : c)));
    // Sincroniza o Km devolvido de volta com o cadastro da viatura/embarcação
    const categoria = veiculoCategoria(entry.veiculoId);
    const kmFormatado = kmDevolucao.toLocaleString("pt-BR");
    if (categoria === "viaturas") saveViaturas(viaturas.map((v) => (v.id === entry.veiculoId ? { ...v, km: kmFormatado } : v)));
    else saveEmbarcacoes(embarcacoes.map((v) => (v.id === entry.veiculoId ? { ...v, km: kmFormatado } : v)));
    setDevolvendoChave(null);
  };
  const chavesEmAbertoLongo = chavesLog.filter((c) => {
    if (c.devolvidaEm) return false;
    const dt = parseBRDateHora(c.retiradaEm);
    if (!dt) return false;
    return (Date.now() - dt.getTime()) / 3600000 >= 12;
  });
  const addChaveVeiculo = (veiculoId) => {
    if (!chavesVeiculos.includes(veiculoId)) saveChavesVeiculos([...chavesVeiculos, veiculoId]);
    setChaveVeiculoModalOpen(false);
  };
  const deleteChaveVeiculo = (veiculoId, nome) => {
    const aberta = chaveAbertaFor(veiculoId);
    if (aberta) { alert("Essa viatura tem uma chave em aberto. Registre a devolução antes de remover."); return; }
    askConfirm(`Remover "${nome}" do controle de chaves?`, () => saveChavesVeiculos(chavesVeiculos.filter((id) => id !== veiculoId)));
  };
  const opcoesParaAdicionar = [...viaturas, ...embarcacoes].filter((v) => !chavesVeiculos.includes(v.id));
  const chavesLogFiltrado = chavesLog.filter((c) => {
    const buscaOk = !chavesBusca || c.veiculoNome.toLowerCase().includes(chavesBusca.toLowerCase()) || c.militar.toLowerCase().includes(chavesBusca.toLowerCase());
    const dataOk = !chavesBuscaData || c.retiradaEm.includes(chavesBuscaData) || (c.devolvidaEm && c.devolvidaEm.includes(chavesBuscaData));
    return buscaOk && dataOk;
  });

  /* ---- manutenção de equipamentos ---- */
  const saveEquipamento = (form) => {
    const exists = manutencoes.some((x) => x.id === form.id);
    saveManutencoes(exists ? manutencoes.map((x) => (x.id === form.id ? form : x)) : [form, ...manutencoes]);
    setEquipModalOpen(false); setEditingEquip(null);
  };
  const deleteEquipamento = (eq) => {
    askConfirm(`Excluir "${eq.nome}" do controle de manutenção?`, () => saveManutencoes(manutencoes.filter((x) => x.id !== eq.id)));
  };
  const concluirEquipamento = (eq) => {
    askConfirm(`Marcar "${eq.nome}" como manutenção concluída?`, () => {
      saveManutencoes(manutencoes.map((x) => (x.id === eq.id ? { ...x, dataConclusao: agoraFormatado().split(" ")[0] } : x)));
    });
  };
  const manutencoesAtivas = manutencoes.filter((e) => !e.dataConclusao);
  const manutencoesVisiveis = mostrarConcluidos ? manutencoes : manutencoesAtivas;
  const manutencoesAtrasadas = manutencoesAtivas.filter((e) => {
    const dt = parseBRDate(e.dataPrevisao);
    return dt && dt < new Date(new Date().setHours(0, 0, 0, 0));
  });
  const manutencoesAltaPrioridadeNaoAtrasadas = manutencoesAtivas.filter(
    (e) => e.prioridade === "Alta" && !manutencoesAtrasadas.some((a) => a.id === e.id)
  );

  /* ---- cautelas de equipamentos ---- */
  const saveCautelaEquip = (form) => {
    const exists = cautelasEquip.some((x) => x.id === form.id);
    saveCautelasEquip(exists ? cautelasEquip.map((x) => (x.id === form.id ? form : x)) : [form, ...cautelasEquip]);
    setCautelaEquipModalOpen(false); setEditingCautelaEquip(null);
  };
  const deleteCautelaEquip = (c) => {
    askConfirm(`Excluir a cautela de "${c.equipamentoNome}"?`, () => saveCautelasEquip(cautelasEquip.filter((x) => x.id !== c.id)));
  };
  const devolverCautelaEquip = (c) => {
    askConfirm(`Confirmar devolução de "${c.equipamentoNome}" por ${c.militar}?`, () => {
      saveCautelasEquip(cautelasEquip.map((x) => (x.id === c.id ? { ...x, dataDevolucao: agoraFormatado().split(" ")[0] } : x)));
    });
  };
  const cautelasAtivas = cautelasEquip.filter((c) => !c.dataDevolucao);
  const cautelaAtrasada = (c) => {
    if (c.dataDevolucao) return false;
    const dt = parseBRDate(c.dataPrevisao);
    return dt && dt < new Date(new Date().setHours(0, 0, 0, 0));
  };
  const cautelasAtrasadas = cautelasAtivas.filter(cautelaAtrasada);
  const cautelasVisiveis = (mostrarDevolvidas ? cautelasEquip : cautelasAtivas).filter((c) => {
    const busca = cautelaBusca.trim().toLowerCase();
    if (!busca) return true;
    return c.equipamentoNome.toLowerCase().includes(busca) || c.militar.toLowerCase().includes(busca);
  });

  const today = new Date();
  const calDate = new Date(today.getFullYear(), today.getMonth() + calMonthOffset, 1);
  const calYear = calDate.getFullYear(), calMonth = calDate.getMonth();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const escalaByDate = {};
  escalas.forEach((e) => { escalaByDate[e.data] = e; });
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const responsavelHojeEsc = escalaByDate[`${String(today.getDate()).padStart(2, "0")}/${String(today.getMonth() + 1).padStart(2, "0")}/${today.getFullYear()}`];
  const responsavelHojeInfo = responsavelHojeEsc ? MILITARES.find((m) => m.nome === responsavelHojeEsc.militar) : null;
  const monthEscalas = escalas.filter((e) => { const dt = parseBRDate(e.data); return dt && dt.getFullYear() === calYear && dt.getMonth() === calMonth; }).sort((a, b) => parseBRDate(a.data) - parseBRDate(b.data));

  /* ---- overview cards ---- */
  const manutCriticaCount = allVehicles.filter((v) => v.status === "manutencao").length;
  const badgeVeic = manutCriticaCount === 0 ? SEV.ok : manutCriticaCount === 1 ? SEV.atencao : SEV.critico;
  const countStatus = (list, status) => list.filter((v) => v.status === status).length;
  const chavesRetiradasCount = chavesLog.filter((c) => !c.devolvidaEm).length;
  const chavesNoClaviculario = chavesVeiculos.length - chavesRetiradasCount;

  /* ---- alertas agregados ---- */
  const alertsVeiculos = [
    ...allVehicles.filter((v) => v.status === "manutencao").map((v) => ({ id: "al-" + v.id, titulo: `${v.nome} — ${v.motivo || "em manutenção"}`, sub: `${viaturas.includes(v) ? "Viaturas" : "Embarcações"}`, sev: SEV.atencao, veiculoNome: v.nome })),
    ...problemasAbertos.map((p) => ({ id: "al-" + p.id, titulo: `${p.veiculoNome} — problema reportado (${p.categoria})`, sub: `${p.condutor} · ${p.data}`, desc: p.descricao, sev: SEV.atencao, foto: p.foto, problemaId: p.id, veiculoNome: p.veiculoNome })),
    ...chavesEmAbertoLongo.map((c) => ({ id: "al-chave-" + c.id, titulo: `Chave de ${c.veiculoNome} retirada há mais de 12h`, sub: `Com ${c.militar} · desde ${c.retiradaEm}`, sev: SEV.atencao, veiculoNome: c.veiculoNome })),
  ];
  const alertsEquipamentos = [
    ...manutencoesAtrasadas.map((e) => ({ id: "al-eq-" + e.id, titulo: `${e.nome} — manutenção com previsão de entrega vencida`, sub: `Previsão era ${e.dataPrevisao}${e.patrimonio ? ` · Patrimônio ${e.patrimonio}` : ""}`, sev: SEV.critico, equipNome: e.nome })),
    ...manutencoesAltaPrioridadeNaoAtrasadas.map((e) => ({ id: "al-eq-alta-" + e.id, titulo: `${e.nome} — manutenção de prioridade Alta`, sub: `Previsão de entrega: ${e.dataPrevisao || "não informada"}${e.patrimonio ? ` · Patrimônio ${e.patrimonio}` : ""}`, sev: SEV.atencao, equipNome: e.nome })),
  ];
  const alerts = [...alertsVeiculos, ...alertsEquipamentos];


  const subtitleMap = {
    geral: "Controle de Viaturas e Embarcações",
    viaturas: "Controle de Viaturas e Embarcações",
    embarcacoes: "Controle de Viaturas e Embarcações",
    chaves: "Controle de Viaturas e Embarcações",
    manutencao: "Controle de Viaturas e Embarcações",
    cautelas: "Controle de Viaturas e Embarcações",
    escalas: "Controle de Viaturas e Embarcações",
    alertas: "Controle de Viaturas e Embarcações",
  };

  return (
    <div className="app-shell">
      <style>{CSS}</style>
      <div className="topstrip" />
      <div className="app-body">
        <Sidebar tab={tab} setTab={setTab} org={org} onLogoChange={handleLogoChange} visaoExterna={visaoExterna} open={sidebarOpen} onClose={() => setSidebarOpen(false)} />
        <div className="main-col">
          <Header subtitle={subtitleMap[tab]} org={org} onEditOrg={() => setEditingOrgOpen(true)} onMenuClick={() => setSidebarOpen(true)} />
          <main className="content">

            {tab === "geral" && (
              <>
                <div className="section-head"><h2>Visão Geral dos Setores</h2><div className="muted-sm">Atualizado em {today.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}</div></div>
                <div className="ov-grid ov-grid-5">
                  <div className="ov-card ov-card-click" onClick={() => setTab("viaturas")}>
                    <div className="ov-top"><div className="ov-icon" style={{ background: "#FBE3E3" }}><Truck size={20} /></div><div className="ov-card-title">Viaturas</div><Pill sev={badgeVeic} /></div>
                    <div className="ov-num">{viaturas.length}</div>
                    <div className="ov-label">viaturas cadastradas</div>
                    <div className="ov-breakdown">
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.disponivel.fg }} />{countStatus(viaturas, "disponivel")} Disponível</span>
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.emprestado.fg }} />{countStatus(viaturas, "emprestado")} Emprestada</span>
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.manutencao.fg }} />{countStatus(viaturas, "manutencao")} Manutenção</span>
                    </div>
                  </div>

                  <div className="ov-card ov-card-click" onClick={() => setTab("embarcacoes")}>
                    <div className="ov-top"><div className="ov-icon" style={{ background: "#E3EDFB" }}><Anchor size={20} /></div><div className="ov-card-title">Embarcações</div></div>
                    <div className="ov-num">{embarcacoes.length}</div>
                    <div className="ov-label">embarcações cadastradas</div>
                    <div className="ov-breakdown">
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.disponivel.fg }} />{countStatus(embarcacoes, "disponivel")} Disponível</span>
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.emprestado.fg }} />{countStatus(embarcacoes, "emprestado")} Emprestada</span>
                      <span className="ov-breakdown-item"><i className="ov-dot" style={{ background: VSTATUS.manutencao.fg }} />{countStatus(embarcacoes, "manutencao")} Manutenção</span>
                    </div>
                  </div>

                  <div className="ov-card ov-card-click" onClick={() => setTab("chaves")}>
                    <div className="ov-top"><div className="ov-icon" style={{ background: "#FCE8DA" }}><Key size={20} /></div><div className="ov-card-title">Chaves</div><Pill sev={chavesRetiradasCount ? { label: "Atenção", fg: "#C15A1B", bg: "#FCE8DA" } : SEV.ok} /></div>
                    <div className="ov-num">{chavesVeiculos.length}</div>
                    <div className="ov-label">viaturas no controle de chaves</div>
                    <div className="ov-divider" />
                    <div className="ov-sub">{chavesNoClaviculario} no claviculário · {chavesRetiradasCount} retirada(s)</div>
                  </div>

                  <div className="ov-card ov-card-click" onClick={() => setTab("manutencao")}>
                    <div className="ov-top"><div className="ov-icon" style={{ background: "#FBF0DC" }}><Wrench size={20} /></div><div className="ov-card-title">Manutenção</div><Pill sev={manutencoesAtrasadas.length ? SEV.critico : manutencoesAtivas.length ? SEV.atencao : SEV.ok} /></div>
                    <div className="ov-num">{manutencoesAtivas.length}</div>
                    <div className="ov-label">equipamentos em manutenção</div>
                    <div className="ov-divider" />
                    <div className="ov-sub">{manutencoesAtrasadas.length} com previsão vencida</div>
                  </div>

                  <div className="ov-card ov-card-click" onClick={() => setTab("cautelas")}>
                    <div className="ov-top"><div className="ov-icon" style={{ background: "#E4F2E8" }}><ClipboardList size={20} /></div><div className="ov-card-title">Cautelas</div><Pill sev={cautelasAtrasadas.length ? SEV.critico : cautelasAtivas.length ? SEV.atencao : SEV.ok} /></div>
                    <div className="ov-num">{cautelasAtivas.length}</div>
                    <div className="ov-label">cautelas em aberto</div>
                    <div className="ov-divider" />
                    <div className="ov-sub">{cautelasAtrasadas.length} com devolução atrasada</div>
                  </div>
                </div>

                <div className="panel">
                  <div className="panel-headrow">
                    <h3>Pendências recentes</h3>
                    <button className="link-btn" onClick={() => setTab("alertas")}>Ver todos os alertas →</button>
                  </div>
                  {alerts.length === 0 && <div className="empty">Nenhuma pendência no momento.</div>}
                  {alerts.slice(0, 3).map((a) => (
                    <div className="alert-row" key={a.id} style={{ borderLeftColor: a.sev.fg }}>
                      <div className="alert-main">
                        {a.foto && <img className="alert-thumb" src={a.foto} alt="" onClick={() => setViewingPhoto(a.foto)} />}
                        <div><div className="alert-title">{a.titulo}</div><div className="alert-sub">{a.sub}</div>{a.desc && <div className="alert-desc">{a.desc}</div>}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        {a.problemaId && !visaoExterna && (
                          <>
                            <button className="btn-secondary sm internal-only" onClick={() => resolveProblem(a.problemaId)}>Resolvido</button>
                            <button className="icon-btn icon-danger internal-only" title="Excluir alerta" onClick={() => deleteProblem(a.problemaId)}><Trash2 size={14} /></button>
                          </>
                        )}
                        <Pill sev={a.sev} />
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {(tab === "viaturas" || tab === "embarcacoes") && (
              <>
                <div className="section-head">
                  <h2>{tab === "viaturas" ? "Viaturas" : "Embarcações"}</h2>
                  {!visaoExterna && <button className="btn-primary sm internal-only" onClick={() => openEdit(tab, null)}><Plus size={14} /> {tab === "viaturas" ? "Nova viatura" : "Nova embarcação"}</button>}
                </div>
                <div className="muted-sm" style={{ marginBottom: 10 }}>
                  {Object.entries(VSTATUS).map(([k, s], idx) => {
                    const n = (tab === "viaturas" ? viaturas : embarcacoes).filter((v) => v.status === k).length;
                    return <span key={k}>{idx > 0 ? " · " : ""}{n} {s.label.toLowerCase()}</span>;
                  })}
                </div>
                <div className="grid-vehicles">
                  {(tab === "viaturas" ? viaturas : embarcacoes).map((v) => (
                    <VehicleCard key={v.id} v={v} problemCount={problemCountFor(v.id)} onEdit={(v) => openEdit(tab, v)} onDelete={(v) => deleteVehicle(tab, v)} onReport={(v) => setReporting(v)} onPhoto={(v, file) => handleVehiclePhoto(tab, v, file)} onRemovePhoto={(v) => handleRemoveVehiclePhoto(tab, v)} onViewProblems={(v) => setViewingProblemsVeiculo(v)} externa={visaoExterna} />
                  ))}
                </div>
              </>
            )}

            {tab === "chaves" && (
              <>
                <div className="section-head">
                  <h2>Controle de Chaves</h2>
                  {!visaoExterna && <button className="btn-primary sm internal-only" onClick={() => setChaveVeiculoModalOpen(true)}><Plus size={14} /> Adicionar viatura</button>}
                </div>
                <div className="muted-sm" style={{ marginBottom: 14 }}>Somente viaturas administrativas — as operacionais ficam sob responsabilidade direta do condutor</div>

                <div className="ov-grid" style={{ gridTemplateColumns: "repeat(2,1fr)", marginBottom: 16 }}>
                  <div className="stat-card"><div className="stat-num" style={{ color: "#2F7D4F" }}>{chavesVeiculos.length - chavesLog.filter((c) => !c.devolvidaEm).length}</div><div className="stat-label">chaves no claviculário</div></div>
                  <div className="stat-card"><div className="stat-num" style={{ color: chavesLog.filter((c) => !c.devolvidaEm).length ? "#C15A1B" : "#2F7D4F" }}>{chavesLog.filter((c) => !c.devolvidaEm).length}</div><div className="stat-label">chaves retiradas</div></div>
                </div>

                {chavesVeiculos.length === 0 && (
                  <div className="panel"><div className="empty">Nenhuma viatura cadastrada no controle de chaves ainda. Clique em "Adicionar viatura" para começar.</div></div>
                )}

                <div className="grid-vehicles">
                  {chavesVeiculos.map((veiculoId) => {
                    const v = findVeiculoById(veiculoId);
                    if (!v) {
                      return (
                        <div className="vcard" key={veiculoId}>
                          <div className="vcard-body">
                            <div className="vcard-name">Viatura removida</div>
                            <div className="muted-sm">Esse veículo não existe mais em Viaturas/Embarcações.</div>
                            {!visaoExterna && <button className="btn-secondary sm" style={{ marginTop: 8 }} onClick={() => deleteChaveVeiculo(veiculoId, "veículo removido")}>Remover daqui</button>}
                          </div>
                        </div>
                      );
                    }
                    const aberta = chaveAbertaFor(v.id);
                    return (
                      <div className="vcard" key={veiculoId}>
                        <div className="vcard-media" style={v.foto ? { background: `${v.fotoPosX ?? 50}% ${v.fotoPosY ?? 50}% / cover no-repeat url(${v.foto})` } : {}}>
                          {!v.foto && <VIcon tipo={v.tipo} />}
                          {!v.foto && <span className="vcard-nofoto"><ImageOff size={11} /> sem foto cadastrada</span>}
                          <span className={aberta ? "pill vcard-badge chave-badge-fora" : "pill vcard-badge chave-badge-casa"}>
                            {aberta ? aberta.militar : v.qth}
                          </span>
                        </div>
                        <div className="vcard-body">
                          <div className="vcard-name">{v.nome}</div>
                          <div className="vcard-type">{v.tipo}</div>
                          {aberta ? (
                            <div className="alert-sub" style={{ margin: "6px 0" }}>Desde {aberta.retiradaEm} · Km saída: {aberta.kmSaida}{aberta.obs ? ` · ${aberta.obs}` : ""}</div>
                          ) : (
                            <div className="alert-sub" style={{ margin: "6px 0" }}>No claviculário</div>
                          )}
                          {!visaoExterna && (
                            <div className="vcard-actions internal-only">
                              {aberta ? (
                                <button className="btn-ghost" onClick={() => setDevolvendoChave(aberta)}><Key size={13} /> Devolver</button>
                              ) : (
                                <button className="btn-ghost" onClick={() => setChaveModalVeiculo({ veiculo: v })}><Key size={13} /> Retirar</button>
                              )}
                              <div className="vcard-icons">
                                <button className="icon-btn icon-danger" title="Remover do controle de chaves" onClick={() => deleteChaveVeiculo(v.id, v.nome)}><Trash2 size={14} /></button>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="panel" style={{ marginTop: 16 }}>
                  <h3 style={{ marginTop: 0 }}>Últimas movimentações</h3>
                  <div className="chaves-filtros">
                    <input
                      className="chaves-filtro-input"
                      value={chavesBusca}
                      onChange={(e) => { setChavesBusca(e.target.value); setChavesVisiveis(25); }}
                      placeholder="Buscar por viatura ou militar..."
                    />
                    <input
                      className="chaves-filtro-input"
                      value={chavesBuscaData}
                      onChange={(e) => { setChavesBuscaData(e.target.value); setChavesVisiveis(25); }}
                      placeholder="Buscar por data (dd/mm/aaaa)"
                    />
                  </div>
                  {chavesLogFiltrado.length === 0 && <div className="empty">Nenhuma movimentação encontrada{chavesLog.length > 0 ? " para esse filtro." : " ainda."}</div>}
                  {chavesLogFiltrado.slice(0, chavesVisiveis).map((c) => (
                    <div className="alert-row" key={c.id} style={{ borderLeftColor: "transparent" }}>
                      <div>
                        <div className="alert-title">{c.veiculoNome} — {c.militar}</div>
                        <div className="alert-sub">
                          Retirada: {c.retiradaEm} (Km {c.kmSaida})
                          {c.devolvidaEm ? ` · Devolução: ${c.devolvidaEm} (Km ${c.kmDevolucao}) · Rodado: ${c.kmDevolucao - c.kmSaida} km` : " · ainda em aberto"}
                          {c.obs ? ` · ${c.obs}` : ""}
                        </div>
                      </div>
                      <Pill sev={c.devolvidaEm ? SEV.ok : { label: "Em aberto", fg: "#C15A1B", bg: "#FCE8DA" }} />
                    </div>
                  ))}
                  {chavesLogFiltrado.length > chavesVisiveis && (
                    <div style={{ textAlign: "center", marginTop: 12 }}>
                      <button className="btn-secondary sm" onClick={() => setChavesVisiveis((n) => n + 25)}>Ver mais</button>
                    </div>
                  )}
                </div>
              </>
            )}

            {tab === "manutencao" && (
              <>
                <div className="section-head">
                  <h2>Manutenção de Equipamentos</h2>
                  <button className="btn-primary sm" onClick={() => { setEditingEquip(null); setEquipModalOpen(true); }}><Plus size={14} /> Novo equipamento</button>
                </div>
                <div className="muted-sm" style={{ marginBottom: 14 }}>Equipamentos que quebraram e estão em manutenção/conserto</div>

                <div className="ov-grid" style={{ gridTemplateColumns: "repeat(2,1fr)", marginBottom: 16 }}>
                  <div className="stat-card"><div className="stat-num" style={{ color: manutencoesAtivas.length ? "#C15A1B" : "#2F7D4F" }}>{manutencoesAtivas.length}</div><div className="stat-label">em manutenção</div></div>
                  <div className="stat-card"><div className="stat-num" style={{ color: manutencoesAtrasadas.length ? "#B23B3B" : "#2F7D4F" }}>{manutencoesAtrasadas.length}</div><div className="stat-label">com previsão vencida</div></div>
                </div>

                <div className="section-head" style={{ marginBottom: 10 }}>
                  <span />
                  <button className="btn-secondary sm" onClick={() => setMostrarConcluidos((v) => !v)}>
                    {mostrarConcluidos ? "Ocultar concluídos" : "Mostrar concluídos"}
                  </button>
                </div>

                {manutencoesVisiveis.length === 0 && (
                  <div className="panel"><div className="empty">Nenhum equipamento {mostrarConcluidos ? "cadastrado" : "em manutenção"} no momento.</div></div>
                )}

                <div className="grid-vehicles">
                  {manutencoesVisiveis.map((eq) => (
                    <EquipamentoCard
                      key={eq.id}
                      eq={eq}
                      onEdit={(eq) => { setEditingEquip(eq); setEquipModalOpen(true); }}
                      onDelete={deleteEquipamento}
                      onConcluir={concluirEquipamento}
                    />
                  ))}
                </div>
              </>
            )}

            {tab === "cautelas" && (
              <>
                <div className="section-head">
                  <h2>Cautelas de Equipamentos</h2>
                  <button className="btn-primary sm" onClick={() => { setEditingCautelaEquip(null); setCautelaEquipModalOpen(true); }}><Plus size={14} /> Nova cautela</button>
                </div>
                <div className="muted-sm" style={{ marginBottom: 14 }}>Equipamentos emprestados a militares, com previsão de devolução</div>

                <div className="ov-grid" style={{ gridTemplateColumns: "repeat(2,1fr)", marginBottom: 16 }}>
                  <div className="stat-card"><div className="stat-num" style={{ color: cautelasAtivas.length ? "#C15A1B" : "#2F7D4F" }}>{cautelasAtivas.length}</div><div className="stat-label">cautelas em aberto</div></div>
                  <div className="stat-card"><div className="stat-num" style={{ color: cautelasAtrasadas.length ? "#B23B3B" : "#2F7D4F" }}>{cautelasAtrasadas.length}</div><div className="stat-label">devoluções atrasadas</div></div>
                </div>

                <div className="chaves-filtros">
                  <input
                    className="chaves-filtro-input"
                    value={cautelaBusca}
                    onChange={(e) => setCautelaBusca(e.target.value)}
                    placeholder="Buscar por equipamento ou militar..."
                  />
                  <button className="btn-secondary sm" onClick={() => setMostrarDevolvidas((v) => !v)}>
                    {mostrarDevolvidas ? "Ocultar devolvidas" : "Mostrar devolvidas"}
                  </button>
                </div>

                {cautelasVisiveis.length === 0 && (
                  <div className="panel"><div className="empty">Nenhuma cautela encontrada.</div></div>
                )}

                <div className="grid-vehicles">
                  {cautelasVisiveis.map((c) => (
                    <CautelaEquipCard
                      key={c.id}
                      c={c}
                      atrasada={cautelaAtrasada(c)}
                      onEdit={(c) => { setEditingCautelaEquip(c); setCautelaEquipModalOpen(true); }}
                      onDelete={deleteCautelaEquip}
                      onDevolver={devolverCautelaEquip}
                    />
                  ))}
                </div>
              </>
            )}

            {tab === "escalas" && (
              <>
                <h2 className="page-title">Escalas</h2>
                <div className="muted-sm" style={{ marginBottom: 14 }}>Responsável diário · {MONTHS[calMonth]}/{calYear}</div>

                <div className="today-card">
                  <div className="today-label">RESPONSÁVEL DE HOJE</div>
                  {responsavelHojeEsc ? (
                    <div className="today-row">
                      <div className="today-avatar">{militarCodigo(responsavelHojeEsc.militar)}</div>
                      <div>
                        <div className="today-name">{responsavelHojeEsc.militar}</div>
                        <div className="today-sub">
                          {responsavelHojeInfo ? `Matrícula ${responsavelHojeInfo.matricula} · Contato ${responsavelHojeInfo.telefone}` : ""}
                        </div>
                      </div>
                    </div>
                  ) : <div className="empty" style={{ color: "#C9C2B4" }}>Nenhum militar escalado para hoje.</div>}
                </div>

                <div className="section-head" style={{ marginTop: 18 }}>
                  <div className="cal-nav">
                    <button className="icon-btn" onClick={() => setCalMonthOffset((o) => o - 1)}><ChevronLeft size={16} /></button>
                    <h2 style={{ minWidth: 170, textAlign: "center", margin: 0 }}>{MONTHS[calMonth]} {calYear}</h2>
                    <button className="icon-btn" onClick={() => setCalMonthOffset((o) => o + 1)}><ChevronRight size={16} /></button>
                  </div>
                  {!visaoExterna && <button className="btn-primary sm internal-only" onClick={() => { setEscalaDefaultDate(""); setEditingEscala(null); setEditingEscalaOpen(true); }}><Plus size={14} /> Lançar escala</button>}
                </div>

                <div className="panel">
                  <div className="cal-weekdays">{WEEKDAYS.map((w) => <div key={w} className="cal-weekday">{w}</div>)}</div>
                  <div className="cal-grid">
                    {cells.map((d, idx) => {
                      if (!d) return <div key={idx} className="cal-cell empty-cell" />;
                      const dateStr = `${String(d).padStart(2, "0")}/${String(calMonth + 1).padStart(2, "0")}/${calYear}`;
                      const esc = escalaByDate[dateStr];
                      const cellDate = new Date(calYear, calMonth, d);
                      const isToday = sameDate(cellDate, today);
                      const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;
                      const isFuturePending = !esc && !isWeekend && cellDate >= new Date(today.getFullYear(), today.getMonth(), today.getDate());
                      return (
                        <div key={idx} className={`cal-cell ${isToday ? "is-today" : ""} ${isFuturePending ? "is-pending" : ""}`}
                          title={esc?.obs || ""}
                          onClick={() => !visaoExterna && !isWeekend && (() => { setEditingEscala(esc || null); setEscalaDefaultDate(dateStr); setEditingEscalaOpen(true); })()}>
                          <div className="cal-daynum">{d}</div>
                          {esc?.obs && <div className="cal-obs-dot" title={esc.obs} />}
                          {esc ? <div className="cal-code">{militarCodigo(esc.militar)}</div> : isFuturePending ? <div className="cal-pending">Pendente</div> : null}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="panel" style={{ marginTop: 14 }}>
                  <h3 style={{ marginTop: 0 }}>Escala completa do mês</h3>
                  <div className="table-panel">
                    <div className="table-head esc-head"><div>Data</div><div>Militar escalado</div><div>Observação</div></div>
                    {monthEscalas.map((e) => {
                      const isToday = e.data === `${String(today.getDate()).padStart(2, "0")}/${String(today.getMonth() + 1).padStart(2, "0")}/${today.getFullYear()}`;
                      return (
                        <div className="table-row esc-row" key={e.id} style={{ borderLeftColor: "transparent", gridTemplateColumns: visaoExterna ? "0.6fr 1.4fr 1fr" : "0.6fr 1.2fr 1fr 60px" }}>
                          <div className="muted-sm">{e.data.slice(0, 5)}</div>
                          <div className="tbold">{e.militar}</div>
                          <div className="muted-sm">{isToday ? "Escala atual" : e.obs || "—"}</div>
                          {!visaoExterna && (
                            <div className="table-actions internal-only">
                              <button className="icon-btn" onClick={() => { setEditingEscala(e); setEscalaDefaultDate(""); setEditingEscalaOpen(true); }}><Pencil size={14} /></button>
                              <button className="icon-btn icon-danger" onClick={() => deleteEscala(e)}><Trash2 size={14} /></button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

            {tab === "alertas" && (
              <>
                <h2 className="page-title">Alertas e Pendências</h2>
                <div className="muted-sm" style={{ marginBottom: 14 }}>Itens que exigem atenção da equipe da B/4</div>

                <h3 className="alertas-section-title">Viaturas e Embarcações</h3>
                <div className="chaves-filtros">
                  <input
                    className="chaves-filtro-input"
                    value={alertasFiltroVeiculo}
                    onChange={(e) => setAlertasFiltroVeiculo(e.target.value)}
                    placeholder="Buscar por nome da viatura ou embarcação..."
                  />
                </div>
                <div className="panel" style={{ marginBottom: 20 }}>
                  {(() => {
                    const busca = alertasFiltroVeiculo.trim().toLowerCase();
                    const filtrados = busca ? alertsVeiculos.filter((a) => (a.veiculoNome || "").toLowerCase().includes(busca)) : alertsVeiculos;
                    if (filtrados.length === 0) {
                      return <div className="empty">{busca ? "Nenhuma pendência encontrada para essa busca." : "Nenhuma pendência de viaturas/embarcações no momento."}</div>;
                    }
                    return filtrados.map((a) => (
                      <div className="alert-row" key={a.id} style={{ borderLeftColor: a.sev.fg }}>
                        <div className="alert-main">
                          {a.foto && <img className="alert-thumb" src={a.foto} alt="" onClick={() => setViewingPhoto(a.foto)} />}
                          <div><div className="alert-title">{a.titulo}</div><div className="alert-sub">{a.sub}</div>{a.desc && <div className="alert-desc">{a.desc}</div>}</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          {a.problemaId && !visaoExterna && (
                            <>
                              <button className="btn-secondary sm internal-only" onClick={() => resolveProblem(a.problemaId)}>Resolvido</button>
                              <button className="icon-btn icon-danger internal-only" title="Excluir alerta" onClick={() => deleteProblem(a.problemaId)}><Trash2 size={14} /></button>
                            </>
                          )}
                          <Pill sev={a.sev} />
                        </div>
                      </div>
                    ));
                  })()}
                </div>

                <h3 className="alertas-section-title">Manutenção de Equipamentos</h3>
                <div className="chaves-filtros">
                  <input
                    className="chaves-filtro-input"
                    value={alertasFiltroEquip}
                    onChange={(e) => setAlertasFiltroEquip(e.target.value)}
                    placeholder="Buscar por nome do equipamento..."
                  />
                </div>
                <div className="panel">
                  {(() => {
                    const busca = alertasFiltroEquip.trim().toLowerCase();
                    const filtrados = busca ? alertsEquipamentos.filter((a) => (a.equipNome || "").toLowerCase().includes(busca)) : alertsEquipamentos;
                    if (filtrados.length === 0) {
                      return <div className="empty">{busca ? "Nenhuma pendência encontrada para essa busca." : "Nenhuma pendência de equipamentos no momento."}</div>;
                    }
                    return filtrados.map((a) => (
                      <div className="alert-row" key={a.id} style={{ borderLeftColor: a.sev.fg }}>
                        <div className="alert-main">
                          {a.foto && <img className="alert-thumb" src={a.foto} alt="" onClick={() => setViewingPhoto(a.foto)} />}
                          <div><div className="alert-title">{a.titulo}</div><div className="alert-sub">{a.sub}</div>{a.desc && <div className="alert-desc">{a.desc}</div>}</div>
                        </div>
                        <Pill sev={a.sev} />
                      </div>
                    ));
                  })()}
                </div>
              </>
            )}

          </main>
        </div>
      </div>

      {editingCollection && <VehicleModal initial={editing} onClose={closeEdit} onSave={saveEdit} />}
      {reporting && <ReportModal vehicle={reporting} onClose={() => setReporting(null)} onSubmit={submitReport} />}
      {viewingProblemsVeiculo && (
        <ProblemsListModal
          veiculo={viewingProblemsVeiculo}
          problemas={problemas.filter((p) => p.veiculoId === viewingProblemsVeiculo.id && p.status === "aberto")}
          onClose={() => setViewingProblemsVeiculo(null)}
          onResolve={resolveProblem}
          onDelete={deleteProblem}
          onViewPhoto={setViewingPhoto}
          externa={visaoExterna}
        />
      )}
      {editingEscalaOpen && <EscalaModal initial={editingEscala} defaultDate={escalaDefaultDate} onClose={() => { setEditingEscalaOpen(false); setEditingEscala(null); }} onSave={saveEscala} />}
      {editingOrgOpen && <OrgModal initial={org} onClose={() => setEditingOrgOpen(false)} onSave={(form) => { saveOrg(form); setEditingOrgOpen(false); }} />}
      {pendingConfirm && (
        <ConfirmModal
          message={pendingConfirm.message}
          onCancel={() => setPendingConfirm(null)}
          onConfirm={() => { pendingConfirm.onYes(); setPendingConfirm(null); }}
        />
      )}
      {viewingPhoto && <PhotoLightbox src={viewingPhoto} onClose={() => setViewingPhoto(null)} />}
      {chaveModalVeiculo && (
        <ChaveModal
          veiculo={chaveModalVeiculo.veiculo}
          onClose={() => setChaveModalVeiculo(null)}
          onSave={({ militar, obs, kmSaida }) => retirarChave(chaveModalVeiculo.veiculo, militar, obs, kmSaida)}
        />
      )}
      {devolvendoChave && (
        <DevolverChaveModal
          entry={devolvendoChave}
          onClose={() => setDevolvendoChave(null)}
          onSave={(kmDevolucao) => devolverChave(devolvendoChave, kmDevolucao)}
        />
      )}
      {chaveVeiculoModalOpen && (
        <AddChaveVeiculoModal
          opcoes={opcoesParaAdicionar}
          onClose={() => setChaveVeiculoModalOpen(false)}
          onSave={addChaveVeiculo}
        />
      )}
      {equipModalOpen && (
        <EquipamentoModal
          initial={editingEquip}
          onClose={() => { setEquipModalOpen(false); setEditingEquip(null); }}
          onSave={saveEquipamento}
        />
      )}
      {cautelaEquipModalOpen && (
        <CautelaEquipModal
          initial={editingCautelaEquip}
          onClose={() => { setCautelaEquipModalOpen(false); setEditingCautelaEquip(null); }}
          onSave={saveCautelaEquip}
        />
      )}
    </div>
  );
}

const CSS = `
:root{
  --bg:#F5F1E8; --panel:#FFFFFF; --ink:#211C18; --muted:#6B6560;
  --red:#A6192E; --red-dark:#7A1220; --gold:#C9A227; --border:#E7E1D5;
}
*{box-sizing:border-box;}
.app-shell{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:100%;}
.loading{padding:40px;text-align:center;color:var(--muted);font-family:sans-serif;}
.topstrip{height:4px;background:linear-gradient(90deg,var(--red),var(--gold));}
.app-body{display:flex;align-items:stretch;}
.sidebar{width:224px;flex-shrink:0;background:#1C1917;color:#EDE8DF;display:flex;flex-direction:column;padding:18px 12px;min-height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;}
.brand-mark.editable{cursor:pointer;}
.brand-mark-hint{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:none;align-items:center;justify-content:center;}
.brand-mark.editable:hover .brand-mark-hint{display:flex;}
.brand-title{font-weight:700;font-size:14px;color:var(--gold);}
.brand-sub{font-size:11px;color:#B7B0A3;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:9px;background:none;border:none;color:#D8D2C6;font-size:13px;font-weight:600;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;width:100%;}
.nav-item:hover{background:#2A241F;}
.nav-item.active{background:var(--red);color:#fff;}
.chev{transition:transform .15s;}
.chev.open{transform:rotate(180deg);}
.nav-sub{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 30px;}
.nav-subitem{background:none;border:none;color:#B7B0A3;font-size:12.5px;padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left;}
.nav-subitem:hover{background:#2A241F;color:#EDE8DF;}
.nav-subitem.active{background:#5A1520;color:#fff;font-weight:700;}
.sidebar-foot{font-size:10.5px;color:#8A8378;line-height:1.6;padding:14px 8px 0;border-top:1px solid #322C26;margin-top:10px;}
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.header{background:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.header h1{font-size:22px;margin:0;}
.header-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:18px;}
.toggle{background:#F1EDE3;border-radius:20px;padding:3px;display:flex;}
.toggle-btn{border:none;background:none;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
.toggle-btn.active{background:#1C1917;color:#fff;}
.user{display:flex;align-items:center;gap:9px;}
.vcard-media{position:relative;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B9B2A4;background:repeating-linear-gradient(135deg,#EFEAE0,#EFEAE0 8px,#E7E1D5 8px,#E7E1D5 16px);gap:4px;}
.vcard-photo-btn{position:absolute;bottom:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(28,25,23,.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.vcard-photo-btn:hover{background:rgba(28,25,23,.85);}
.vcard-photo-remove{position:absolute;bottom:8px;right:38px;width:24px;height:24px;border-radius:50%;background:rgba(28,25,23,.6);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.vcard-photo-remove:hover{background:#B23B3B;}
.modal-photo{width:100%;height:170px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:#1C1917;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.user-name{font-size:12.5px;font-weight:700;}
.user-role{font-size:11px;color:var(--muted);}
.content{flex:1;padding:22px 28px 40px;max-width:1180px;}
.page-title{font-size:20px;margin:0 0 4px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section-head h2{font-size:19px;margin:0;}
.muted-sm{font-size:12px;color:var(--muted);}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.ov-grid-5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.ov-breakdown{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.ov-breakdown-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.ov-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.ov-card-click{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
.ov-card-click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(33,28,24,.1);}
.ov-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;}
.ov-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
.ov-card-title{flex:1;font-weight:700;font-size:14.5px;color:var(--ink);}
.ov-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.ov-num{font-family:Georgia,serif;font-size:26px;font-weight:700;}
.ov-label{font-size:12.5px;color:var(--muted);margin-top:2px;}
.ov-divider{height:1px;background:var(--border);margin:12px 0 10px;}
.ov-sub{font-size:12px;color:var(--muted);}
.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
.panel-headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.panel-headrow h3{font-size:14.5px;margin:0;}
.link-btn{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;}
.empty{color:var(--muted);font-size:13px;padding:12px 0;}
.alert-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 4px 12px 12px;border-left:3px solid transparent;border-top:1px solid var(--border);}
.alert-row:first-of-type{border-top:none;}
.alert-main{display:flex;align-items:flex-start;gap:10px;}
.alert-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);cursor:pointer;transition:transform .1s;}
.alert-thumb:hover{transform:scale(1.08);border-color:var(--red);}
.lightbox-back{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px;cursor:zoom-out;}
.lightbox-img{max-width:90vw;max-height:85vh;border-radius:10px;cursor:default;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.lightbox-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lightbox-close:hover{background:rgba(255,255,255,.3);}
.alert-title{font-weight:700;font-size:13px;}
.alert-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.alert-desc{font-size:12.5px;color:var(--ink);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.5;}
.grid-vehicles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.vcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.pill.vcard-badge{position:absolute;top:8px;right:8px;}
.vcard-warn{position:absolute;top:8px;left:8px;width:20px;height:20px;border-radius:50%;background:rgba(28,25,23,.55);color:#fff;display:flex;align-items:center;justify-content:center;}
.vcard-nofoto{font-size:10px;color:#9A9284;display:flex;align-items:center;gap:3px;}
.tt{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(33,28,24,.95);color:#fff;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.5;z-index:2;}
.tt-row{display:flex;align-items:flex-start;gap:6px;}
.tt-warn{color:#FFC98B;}
.tt-ok{color:#9BE0AE;}
.vcard-body{padding:12px;}
.vcard-title-row{display:flex;justify-content:space-between;align-items:flex-start;}
.vcard-name{font-weight:700;font-size:14px;}
.vcard-type{font-size:11px;color:var(--muted);}
.pcount{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--red-dark);background:#FBE3E3;padding:2px 6px;border-radius:10px;height:fit-content;}
.pcount-btn{border:none;cursor:pointer;}
.pcount-btn:hover{background:#B23B3B;color:#fff;}
.problem-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--border);}
.problem-item:first-of-type{border-top:none;}
.problem-item-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.vcard-sub{font-size:12px;color:var(--muted);margin:6px 0 10px;}
.vcard-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0 10px;}
.vcard-info-row{display:flex;justify-content:space-between;gap:6px;font-size:11px;border-bottom:1px dotted var(--border);padding-bottom:2px;}
.vcard-info-k{color:var(--muted);}
.vcard-info-v{font-weight:700;text-align:right;}
.vcard-actions{display:flex;justify-content:space-between;align-items:center;}
.btn-ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--red-dark);display:flex;align-items:center;gap:4px;cursor:pointer;}
.btn-ghost:hover{background:#FBE3E3;}
.vcard-icons{display:flex;gap:4px;}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
.icon-btn:hover{background:var(--border);}
.icon-danger:hover{background:#FBE3E3;color:var(--red-dark);}
.stock-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--border);}
.stock-row:first-of-type{border-top:none;}
.stock-info{flex:1;}
.stock-name{font-size:13px;font-weight:600;margin-bottom:5px;}
.stock-bar-track{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:4px;}
.stock-qty{font-size:12px;font-weight:700;white-space:nowrap;width:110px;text-align:right;}
.stock-actions{display:flex;gap:4px;}
.table-panel{padding:0;}
.table-head{display:grid;grid-template-columns:1.3fr 1.6fr 1fr 1fr 1.3fr 60px;gap:8px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:12px 16px;border-bottom:1px solid var(--border);}
.table-row{display:grid;grid-template-columns:1.3fr 1.6fr 1fr 1fr 1.3fr 60px;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--border);border-left:3px solid transparent;font-size:13px;}
.table-row:first-of-type{border-top:none;}
.esc-head{grid-template-columns:0.6fr 1.4fr 1fr;padding:12px 16px;}
.esc-row{grid-template-columns:0.6fr 1.4fr 1fr;padding:10px 16px;}
.tbold{font-weight:700;}
.table-actions{display:flex;gap:4px;justify-content:flex-end;}
.today-card{background:#1C1917;color:#fff;border-radius:14px;padding:16px 18px;}
.today-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--gold);margin-bottom:10px;}
.today-row{display:flex;align-items:center;gap:12px;}
.today-avatar{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#1C1917;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.today-name{font-family:Georgia,serif;font-size:17px;font-weight:700;}
.today-sub{font-size:12px;color:#C9C2B4;margin-top:2px;}
.cal-nav{display:flex;align-items:center;gap:4px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-weekday{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{position:relative;aspect-ratio:1;border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:#fff;}
.cal-obs-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1px solid #fff;}
.cal-cell:hover{border-color:var(--red);}
.cal-cell.empty-cell{border:none;cursor:default;}
.cal-cell.is-today{background:var(--red);border-color:var(--red);}
.cal-cell.is-today .cal-daynum,.cal-cell.is-today .cal-code{color:#fff;}
.cal-cell.is-pending{background:#FBF0DC;border-style:dashed;}
.cal-daynum{font-size:11px;font-weight:700;}
.cal-code{font-size:10px;font-weight:700;letter-spacing:.02em;}
.cal-pending{font-size:9px;font-weight:700;color:#B0791A;text-transform:uppercase;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-size:28px;font-weight:700;font-family:Georgia,serif;}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;}
.modal-back{position:fixed;inset:0;background:rgba(33,28,24,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:420px;max-height:90vh;overflow:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:15px;font-family:Georgia,serif;}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.modal-body label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
.modal-body input,.modal-body select,.modal-body textarea{font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;color:var(--ink);}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);}
.btn-primary{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary.sm{padding:7px 12px;font-size:12px;}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
.km-rodado{background:#E4F2E8;color:#2F7D4F;font-size:13px;font-weight:700;padding:9px 12px;border-radius:8px;text-align:center;}
.km-rodado-erro{background:#FBE3E3;color:#B23B3B;}
.chave-preview{display:flex;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px;align-items:center;}
.chave-preview-media{width:70px;height:60px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#B9B2A4;background:repeating-linear-gradient(135deg,#EFEAE0,#EFEAE0 6px,#E7E1D5 6px,#E7E1D5 12px);}
.chave-preview-info{flex:1;min-width:0;}
.chave-badge-fora{background:#FCE8DA;color:#C15A1B;}
.chave-badge-casa{background:#E4F2E8;color:#2F7D4F;}
.chaves-filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.chaves-filtro-input{flex:1;min-width:180px;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;color:var(--ink);}
.alertas-section-title{font-family:Georgia,serif;font-size:15px;margin:0 0 8px;color:var(--ink);}

/* ---------------- Responsivo (mobile) ---------------- */
.mobile-menu-btn{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:4px;flex-shrink:0;}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sidebar-overlay{display:none;}
.sidebar-close{display:none;}

@media (max-width: 860px){
  .mobile-menu-btn{display:flex;}
  .header{padding:12px 14px;flex-wrap:wrap;gap:8px;}
  .header h1{font-size:17px;}
  .header-sub{font-size:11px;}
  .header-right{gap:10px;flex-wrap:wrap;}
  .toggle{order:2;}
  .user{order:1;}
  .user-name{font-size:11.5px;}
  .user-role{font-size:10px;}
  .content{padding:16px 14px 32px;}

  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 0 rgba(0,0,0,0);width:250px;}
  .sidebar.open{transform:translateX(0);box-shadow:6px 0 24px rgba(0,0,0,.35);}
  .sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;}
  .sidebar-close{display:flex;background:none;border:none;color:#EDE8DF;cursor:pointer;margin-left:auto;padding:4px;}
  .brand{position:relative;}

  .ov-grid{grid-template-columns:1fr !important;}
  .grid-vehicles{grid-template-columns:1fr !important;}
  .section-head{flex-wrap:wrap;gap:8px;}
  .cal-nav h2{min-width:auto !important;font-size:14px;}
  .cal-grid{gap:3px;}
  .cal-cell{padding:3px;border-radius:6px;}
  .cal-daynum{font-size:9.5px;}
  .cal-code{font-size:8.5px;}
  .cal-pending{font-size:7.5px;}
  .cal-weekday{font-size:9px;}

  .table-panel{overflow-x:auto;}
  .esc-head,.esc-row{min-width:420px;}

  .vcard-info{grid-template-columns:1fr 1fr;}
  .modal{max-width:100%;margin:0 8px;}
}

@media (max-width: 420px){
  .header h1{font-size:15px;}
  .toggle-btn{padding:6px 10px;font-size:11px;}
  .ov-num{font-size:22px;}
}
`;
